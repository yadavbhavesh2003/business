<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>કાઉન્ટર હોમ (ગુજરાતી)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Gujarati:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#0B5A54}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; font-family: Inter, 'Noto Sans Gujarati', system-ui, sans-serif; color: #15181C; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #15181C; color: #FFFFFF; padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="MobileDrawer.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 16px; color: #A9AFB8">શ્રી કૃષ્ણ ટેક્સટાઇલ્સ · કાઉન્ટર 1</span>
        <span style="font-size: 19px; font-weight: 700">કિરણ સોલંકી</span>
      </div>
      <a href="MobileLanguage.dc.html" aria-label="ભાષા બદલો" style="height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid #3C424B; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; text-decoration: none">ગુજ</a>
      <a href="MobileSearch.dc.html" aria-label="શોધો" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </a>
      <a href="MobileProfile.dc.html" aria-label="મારી પ્રોફાઇલ" style="width: 40px; height: 40px; border-radius: 50%; background: #2B3038; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none">KS</a>
    </div>
    <a href="MobileSync.dc.html" role="status" style="{{syncStyle}}">
      <span aria-hidden="true" style="{{syncDot}}"></span>
      <span style="flex: 1">{{syncText}}</span>
      <span style="font-weight: 700">{{syncAction}}</span>
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="MobileBillingGu.dc.html" style="display: flex; align-items: center; justify-content: space-between; text-decoration: none; background: #0F766E; color: #FFFFFF; border-radius: 16px; padding: 16px 20px; min-height: 64px; box-sizing: border-box">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 700">નવું બિલ</span>
        <span style="font-size: 18px; color: #D3ECE8">બિલ બનાવવા અહીં દબાવો</span>
      </span>
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
        <a href="{{a.href}}" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #15181C; background: #FFFFFF; border: 1px solid #E3E5E1; border-radius: 14px; padding: 12px 14px; min-height: 64px; box-sizing: border-box">
          <span style="font-size: 19px; font-weight: 600">{{a.label}}</span>
          <span style="font-size: 17px; color: #5B616B">{{a.gu}}</span>
        </a>
      </sc-for>
    </div>

    <section aria-label="My day" style="background: #FFFFFF; border: 1px solid #E3E5E1; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #5B616B">મારા બિલ</span><span style="font-size: 20px; font-weight: 700">18</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #5B616B">વેચાણ</span><span style="font-size: 20px; font-weight: 700">₹1,24,300</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #5B616B">UPI જમા</span><span style="font-size: 20px; font-weight: 700">₹40,650</span></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; min-height: 0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 19px">તાજેતરના બિલ</h2>
        <a href="MobileBills.dc.html" style="font-size: 18px; font-weight: 600">બધા જુઓ</a>
      </div>
      <sc-for list="{{bills}}" as="b" hint-placeholder-count="3">
        <a href="{{b.href}}" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3E5E1; border-radius: 12px; padding: 10px 12px; min-height: 52px; box-sizing: border-box; text-decoration: none; color: #15181C">
          <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
            <span style="font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.party}}</span>
            <span style="font-size: 16px; color: #5B616B">{{b.no}} · {{b.time}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
            <span style="font-size: 18px; font-weight: 700">{{b.amt}}</span>
            <span style="{{b.chip}}">{{b.state}}</span>
          </div>
        </a>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: #FFFFFF; border-top: 1px solid #E3E5E1; padding: 6px 4px 10px">
    <a href="MobileHomeGu.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #0F766E"><span aria-hidden="true" style="width: 24px; height: 4px; border-radius: 999px; background: #0F766E"></span><span>હોમ</span></a>
    <a href="MobileBills.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #5B616B"><span aria-hidden="true" style="width: 24px; height: 4px"></span><span>બિલ</span></a>
    <a href="MobileBillingGu.dc.html" aria-label="નવું બિલ" style="justify-self: center; width: 64px; height: 64px; margin-top: -30px; border-radius: 50%; background: #0F766E; border: 4px solid #FFFFFF; box-shadow: 0 4px 12px rgba(15,118,110,0.35); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="MobileOutstanding.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #5B616B"><span aria-hidden="true" style="width: 24px; height: 4px"></span><span>પાર્ટી</span></a>
    <a href="MobileDrawer.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600; color: #5B616B"><span aria-hidden="true" style="width: 24px; height: 4px"></span><span>મેનુ</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const offline = this.props.offline ?? true;
    const actions = [
      { label: 'પેમેન્ટ જમા', gu: 'Receive payment · UPI QR', href: 'MobilePayment.dc.html' },
      { label: 'ડિલિવરી ચલણ', gu: 'Delivery challan', href: 'MobileChallan.dc.html' },
      { label: 'સ્ટોક સ્કેન અને તપાસ', gu: 'Scan & check stock', href: 'MobileStock.dc.html' },
      { label: 'ઉઘરાણી', gu: 'આજે 3 · Collections', href: 'MobileCollections.dc.html' }
    ];
    const device = 'font-size: 14px; font-weight: 700; border-radius: 6px; padding: 2px 6px; background: #FDF1E4; color: #9A3412';
    const synced = 'font-size: 14px; font-weight: 700; border-radius: 6px; padding: 2px 6px; background: #E6F2F0; color: #0B5A54';
    const bills = [
      { party: 'Patel Sarees', no: 'D01-001880', time: '3:52 pm', amt: '₹17,252', state: offline ? 'ફોનમાં સેવ' : 'સિંક થયું', chip: offline ? device : synced, href: 'MobileBillView.dc.html' },
      { party: 'Mahavir Cloth Store', no: 'D01-001879', time: '3:41 pm', amt: '₹18,240', state: offline ? 'ફોનમાં સેવ' : 'સિંક થયું', chip: offline ? device : synced, href: 'MobileBillView.dc.html' },
      { party: 'રોકડ ગ્રાહક', no: 'D01-001878', time: '3:28 pm', amt: '₹2,150', state: 'ચૂકવેલ · UPI', chip: synced, href: 'MobileBillView.dc.html' }
    ];
    return {
      syncStyle: 'display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 0 14px; min-height: 44px; font-size: 18px; text-decoration: none; ' + (offline ? 'background: #3A2A18; color: #FBD9A8' : 'background: #16332F; color: #BFE5DF'),
      syncDot: 'width: 9px; height: 9px; border-radius: 50%; background: ' + (offline ? '#F59E0B' : '#34D399'),
      syncText: offline ? 'ઇન્ટરનેટ નથી · 2 બિલ આ ફોનમાં સેવ છે' : 'બધા બિલ સિંક થયા · 1 મિનિટ પહેલાં',
      syncAction: offline ? 'ફરી પ્રયાસ' : 'સિંક',
      actions, bills
    };
  }
}
</script>
</body>
</html>
