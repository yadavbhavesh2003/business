<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Gujarati:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#0B5A54}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F5; font-family: Inter, 'Noto Sans Gujarati', system-ui, sans-serif; color: #15181C">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="background: #15181C; height: 130px"></div>
    <div style="margin: 14px; height: 64px; border-radius: 16px; background: #0F766E"></div>
    <div style="margin: 0 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="height: 64px; border-radius: 14px; background: #FFFFFF"></div><div style="height: 64px; border-radius: 14px; background: #FFFFFF"></div>
      <div style="height: 64px; border-radius: 14px; background: #FFFFFF"></div><div style="height: 64px; border-radius: 14px; background: #FFFFFF"></div>
    </div>
  </div>
  <a href="MobileHome.dc.html" aria-label="Close menu" style="position: absolute; inset: 0; background: rgba(21, 24, 28, 0.55)"></a>

  <nav aria-label="Main menu" style="position: absolute; top: 0; left: 0; bottom: 0; width: 316px; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.18)">
    <div style="background: #15181C; color: #FFFFFF; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #0F766E; display: flex; align-items: center; justify-content: center; font-weight: 700">U</span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">Shree Krishna Textiles</span><span style="font-size: 14px; color: #A9AFB8">Bhavnagar · Counter 1</span></span>
        </div>
        <a href="MobileHome.dc.html" aria-label="Close menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>
      <a href="MobileProfile.dc.html" style="display: flex; align-items: center; gap: 12px; background: #22262C; border-radius: 12px; padding: 8px 12px; text-decoration: none; color: #FFFFFF; min-height: 52px; box-sizing: border-box">
        <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #0F766E; display: flex; align-items: center; justify-content: center; font-weight: 700">KS</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Kiran Solanki</span><span style="font-size: 14px; color: #A9AFB8">Cashier · My profile</span></span>
        <span aria-hidden="true" style="color: #A9AFB8">›</span>
      </a>
      <div style="display: flex; gap: 8px">
        <a href="MobileSync.dc.html" style="{{syncStyle}}"><span aria-hidden="true" style="{{syncDot}}"></span><span>{{syncText}}</span></a>
      </div>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 4px 8px 10px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; padding-top: 6px">
          <button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #5B616B; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer">
            <span>{{g.title}}</span><span aria-hidden="true">{{g.chev}}</span>
          </button>
          <sc-if value="{{g.isOpen}}" hint-placeholder-val="{{true}}">
            <sc-for list="{{g.items}}" as="n" hint-placeholder-count="4">
              <a href="{{n.href}}" style="{{n.style}}">
                <span aria-hidden="true" style="{{n.iconStyle}}">{{n.ic}}</span>
                <span style="flex: 1; display: flex; flex-direction: column"><span>{{n.label}}</span><span style="font-size: 14px; font-weight: 400; color: #5B616B">{{n.gu}}</span></span>
                <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="{{n.badgeStyle}}">{{n.badge}}</span></sc-if>
              </a>
            </sc-for>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="border-top: 1px solid #E3E5E1; padding: 10px 12px 14px; display: flex; gap: 8px">
      <a href="MobileLanguage.dc.html" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #DADDD8; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #15181C; font-size: 16px; font-weight: 600">ગુજ / हिं / En</a>
      <a href="MobileLogin.dc.html" style="flex: 1; height: 44px; border-radius: 10px; background: #15181C; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 600">Switch user</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { closed: { 'Owner': true, 'This phone': true } }; }
  renderVals() {
    const offline = this.props.offline ?? true;
    const active = 'Home';
    const G = [
      ['Daily work', [
        ['Home', 'હોમ', 'MobileHome', 'H'], ['New bill', 'નવું બિલ', 'MobileBilling', '+'],
        ['Bills', 'બિલ યાદી', 'MobileBills', 'B'], ['Held bills', 'રોકેલા બિલ', 'MobileHeld', 'H', '2'], ['Quotation', 'ભાવપત્રક', 'MobileQuotation', 'Q'],
        ['Take order', 'ઓર્ડર', 'MobileSalesOrder', 'O'], ['Delivery challan', 'ચલણ', 'MobileChallan', 'C'], ['Sales return', 'માલ પરત', 'MobileReturn', 'R'], ['Expense', 'ખર્ચ', 'MobileExpense', 'E']]],
      ['Money', [
        ['Receive payment', 'પેમેન્ટ જમા', 'MobilePayment', '₹'], ['UPI QR', 'યુપીઆઈ', 'MobileUpiQr', 'Q', 'New'], ['Collections', 'ઉઘરાણી', 'MobileCollections', '!', '3'], ['Payments', 'પેમેન્ટ યાદી', 'MobilePayments', '₹']]],
      ['Stock & parties', [
        ['Items', 'માલ યાદી', 'MobileItems', 'I'], ['Stock check', 'સ્ટોક', 'MobileStock', 'S'], ['Low stock', 'ઓછો સ્ટોક', 'MobileLowStock', '!', '7'],
        ['Stock count', 'સ્ટોક ગણતરી', 'MobileStockCount', '#'], ['Stock transfer', 'ટ્રાન્સફર', 'MobileTransfer', 'T'], ['Purchase entry', 'ખરીદી', 'MobilePurchase', 'P'],
        ['Parties & dues', 'પાર્ટી બાકી', 'MobileOutstanding', 'P'], ['Dispatch', 'ડિસ્પેચ', 'MobileDispatch', 'D']]],
      ['Alerts', [
        ['Notifications', 'સૂચના', 'MobileNotifications', 'N', '5']]],
      ['Owner', [
        ['Owner home', 'માલિક', 'MobileOwner', 'O'], ['Approvals', 'મંજૂરી', 'MobileApprovals', '✓', '3'], ['Reports', 'રિપોર્ટ', 'MobileReports', 'R'], ['Devices', 'ફોન', 'MobileDevices', 'D']]],
      ['This phone', [
        ['Sync status', 'સિંક', 'MobileSync', '⟳', '2'], ['Printer', 'પ્રિન્ટર', 'MobilePrinter', 'P'], ['Close day', 'દિવસ બંધ', 'MobileCloseDay', '✓'],
        ['Settings', 'સેટિંગ', 'MobileSettings', 'S'], ['Help', 'મદદ', 'MobileHelp', '?']]],
      ['Later (not in MVP)', [
        ['Voice bill', 'બોલીને બિલ', 'MobileVoice', 'V', 'Later'], ['Copilot', 'પૂછો', 'MobileCopilot', 'A', 'Later'], ['Scan supplier bill', 'બિલ સ્કેન', 'MobileScanBill', 'O', 'Later'],
        ['Roll labels', 'લેબલ', 'MobileLabels', 'L', 'Later'], ['Broker commission', 'દલાલી', 'MobileBroker', 'B', 'Later'], ['Training mode', 'પ્રેક્ટિસ', 'MobileTraining', 'T', 'Later']]]
    ];
    const closed = this.state.closed;
    const groups = G.map(([title, items]) => {
      const isOpen = !closed[title];
      return {
        title, isOpen, open: isOpen ? 'true' : 'false', chev: isOpen ? '▾' : '▸',
        toggle: () => this.setState({ closed: Object.assign({}, closed, { [title]: isOpen }) }),
        items: items.map(([label, gu, file, ic, badge]) => {
          const act = label === active;
          const warn = badge && /^\d+$/.test(badge);
          return {
            label, gu, ic, href: file + '.dc.html', badge: badge || '',
            style: 'display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 17px; font-weight: 600; color: #15181C; ' + (act ? 'background: #E6F2F0' : ''),
            iconStyle: 'width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; ' + (act ? 'background: #0F766E; color: #FFFFFF' : 'background: #F1F3EF; color: #3C424B'),
            badgeStyle: 'font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; ' + (warn ? 'background: #F59E0B; color: #15181C' : 'background: #E6F2F0; color: #0B5A54')
          };
        })
      };
    });
    return {
      groups,
      syncText: offline ? 'Offline · 2 bills on phone' : 'All synced · 1 min ago',
      syncStyle: 'flex: 1; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; ' + (offline ? 'background: #3A2A18; color: #FBD9A8' : 'background: #16332F; color: #BFE5DF'),
      syncDot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (offline ? '#F59E0B' : '#34D399')
    };
  }
}
</script>
</body>
</html>
