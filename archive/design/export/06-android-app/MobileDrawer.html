<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { closed: { 'Owner': true, 'This phone': true } }; }
  renderVals() {
    const offline = this.props.offline ?? true;
    const active = 'Home';
    const G = [
      ['Daily work', [
        ['Home', 'હોમ', 'MobileHome', 'H'], ['New bill', 'નવું બિલ', 'MobileBilling', '+'],
        ['Bills', 'બિલ યાદી', 'MobileBills', 'B'], ['Held bills', 'રોકેલા બિલ', 'MobileHeld', 'H', '2'], ['Quotation', 'ભાવપત્રક', 'MobileQuotation', 'Q'],
        ['Take order', 'ઓર્ડર', 'MobileSalesOrder', 'O'], ['Delivery challan', 'ચલણ', 'MobileChallan', 'C'], ['Sales return', 'માલ પરત', 'MobileReturn', 'R'], ['Expense', 'ખર્ચ', 'MobileExpense', 'E']]],
      ['Money', [
        ['Receive payment', 'પેમેન્ટ જમા', 'MobilePayment', '₹'], ['UPI QR', 'યુપીઆઈ', 'MobileUpiQr', 'Q', 'New'], ['Collections', 'ઉઘરાણી', 'MobileCollections', '!', '3'], ['Payments', 'પેમેન્ટ યાદી', 'MobilePayments', '₹']]],
      ['Stock & parties', [
        ['Items', 'માલ યાદી', 'MobileItems', 'I'], ['Stock check', 'સ્ટોક', 'MobileStock', 'S'], ['Low stock', 'ઓછો સ્ટોક', 'MobileLowStock', '!', '7'],
        ['Stock count', 'સ્ટોક ગણતરી', 'MobileStockCount', '#'], ['Stock transfer', 'ટ્રાન્સફર', 'MobileTransfer', 'T'], ['Purchase entry', 'ખરીદી', 'MobilePurchase', 'P'],
        ['Parties & dues', 'પાર્ટી બાકી', 'MobileOutstanding', 'P'], ['Dispatch', 'ડિસ્પેચ', 'MobileDispatch', 'D']]],
      ['Alerts', [
        ['Notifications', 'સૂચના', 'MobileNotifications', 'N', '5']]],
      ['Owner', [
        ['Owner home', 'માલિક', 'MobileOwner', 'O'], ['Approvals', 'મંજૂરી', 'MobileApprovals', '✓', '3'], ['Reports', 'રિપોર્ટ', 'MobileReports', 'R'], ['Devices', 'ફોન', 'MobileDevices', 'D']]],
      ['This phone', [
        ['Sync status', 'સિંક', 'MobileSync', '⟳', '2'], ['Printer', 'પ્રિન્ટર', 'MobilePrinter', 'P'], ['Close day', 'દિવસ બંધ', 'MobileCloseDay', '✓'],
        ['Settings', 'સેટિંગ', 'MobileSettings', 'S'], ['Help', 'મદદ', 'MobileHelp', '?']]],
      ['Later (not in MVP)', [
        ['Voice bill', 'બોલીને બિલ', 'MobileVoice', 'V', 'Later'], ['Copilot', 'પૂછો', 'MobileCopilot', 'A', 'Later'], ['Scan supplier bill', 'બિલ સ્કેન', 'MobileScanBill', 'O', 'Later'],
        ['Roll labels', 'લેબલ', 'MobileLabels', 'L', 'Later'], ['Broker commission', 'દલાલી', 'MobileBroker', 'B', 'Later'], ['Training mode', 'પ્રેક્ટિસ', 'MobileTraining', 'T', 'Later']]]
    ];
    const closed = this.state.closed;
    const groups = G.map(([title, items]) => {
      const isOpen = !closed[title];
      return {
        title, isOpen, open: isOpen ? 'true' : 'false', chev: isOpen ? '▾' : '▸',
        toggle: () => this.setState({ closed: Object.assign({}, closed, { [title]: isOpen }) }),
        items: items.map(([label, gu, file, ic, badge]) => {
          const act = label === active;
          const warn = badge && /^\d+$/.test(badge);
          return {
            label, gu, ic, href: window.DC_HREF(file), badge: badge || '',
            style: 'display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 17px; font-weight: 600; color: #15181C; ' + (act ? 'background: #E6F2F0' : ''),
            iconStyle: 'width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; ' + (act ? 'background: #0F766E; color: #FFFFFF' : 'background: #F1F3EF; color: #3C424B'),
            badgeStyle: 'font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; ' + (warn ? 'background: #F59E0B; color: #15181C' : 'background: #E6F2F0; color: #0B5A54')
          };
        })
      };
    });
    return {
      groups,
      syncText: offline ? 'Offline · 2 bills on phone' : 'All synced · 1 min ago',
      syncStyle: 'flex: 1; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; ' + (offline ? 'background: #3A2A18; color: #FBD9A8' : 'background: #16332F; color: #BFE5DF'),
      syncDot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (offline ? '#F59E0B' : '#34D399')
    };
  }
}
